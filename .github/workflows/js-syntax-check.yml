name: JavaScript Syntax Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check browser scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Check Worker modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            cp "$file" /tmp/unlimited-check.mjs
            node --check /tmp/unlimited-check.mjs
          done < <(find src -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Check story context quality contract
        shell: bash
        run: |
          set -euo pipefail
          cp src/context.js /tmp/context-under-test.mjs
          CONTEXT_MODULE="file:///tmp/context-under-test.mjs" node tests/context-quality.test.mjs

      - name: Check user product flow contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/product-flow.test.mjs

      - name: Check V16 stability contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/v16-stability.test.mjs

      - name: Check V16.3 storage core runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/storage-core-v163.test.mjs

      - name: Check V16.3 chat context runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/chat-context-core-v163.test.mjs

      - name: Check V16.4 runtime cleanup contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/v164-runtime-cleanup.test.mjs

      - name: Check V16.5 observer/history cleanup contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/v165-runtime-cleanup.test.mjs

      - name: Check V16.6 shared event runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/v166-event-runtime.test.mjs

      - name: Check companion mode isolation contract
        shell: bash
        run: |
          set -euo pipefail
          cp src/companion.js /tmp/companion-under-test.mjs
          COMPANION_MODULE="file:///tmp/companion-under-test.mjs" node tests/companion-mode.test.mjs

      - name: Check companion character UI contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/companion-character-editor.test.mjs

      - name: Check companion records and restore contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/companion-records-restore.test.mjs

      - name: Check companion runtime compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/companion-runtime-contract.test.mjs

      - name: Check companion Live2D stage contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/companion-live2d.test.mjs

      - name: Check companion V10 UX contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/companion-v10-ux.test.mjs
