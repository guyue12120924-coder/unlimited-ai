name: JavaScript Syntax Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check browser scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Check Worker modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            cp "$file" /tmp/unlimited-check.mjs
            node --check /tmp/unlimited-check.mjs
          done < <(find src -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
