name: JavaScript Syntax Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check browser scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Check Worker modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            cp "$file" /tmp/unlimited-check.mjs
            node --check /tmp/unlimited-check.mjs
          done < <(find src -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Check story context quality contract
        shell: bash
        run: |
          set -euo pipefail
          cp src/context.js /tmp/context-under-test.mjs
          CONTEXT_MODULE="file:///tmp/context-under-test.mjs" node tests/context-quality.test.mjs

      - name: Check user product flow contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/product-flow.test.mjs

      - name: Check companion mode isolation contract
        shell: bash
        run: |
          set -euo pipefail
          cp src/companion.js /tmp/companion-under-test.mjs
          COMPANION_MODULE="file:///tmp/companion-under-test.mjs" node tests/companion-mode.test.mjs

      - name: Check companion V8 role editor contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/companion-profile-editor.test.mjs

      - name: Check companion restore core contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/companion-v5-guard.test.mjs

      - name: Check companion V8 runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/companion-v8-ux.test.mjs

      - name: Check companion V9 UX contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/companion-v9-ux.test.mjs
