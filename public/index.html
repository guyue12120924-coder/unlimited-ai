<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DeepSeek Chat · 美少女粒子版</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="blur-bg" style="position:fixed;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;filter:blur(20px);z-index:0;opacity:0.6;"></div>
  <div id="clear-img" style="position:fixed;top:0;left:0;width:100%;height:100%;background-size:contain;background-position:center;z-index:0;opacity:0.3;"></div>

  <div id="app">
    <div id="topbar">
      <div class="topbar-shell">
        <div class="topbar-scroll" id="topbarScroll">
          <div class="topbar-inner">
            <div class="pill model-pill">
              <span class="model-label">模型：</span>
              <select id="modelSel"></select>
            </div>
            <button class="iconbtn" id="personaToggle" title="切换内置/自定义人物">😈</button>
            <button class="iconbtn" id="settingsBtn" title="设置">⚙️</button>
            <button class="iconbtn" id="sessionBtn" title="会话管理">📂</button>
            <button class="iconbtn" id="donateBtn" title="打赏">💰</button>
          </div>
        </div>
      </div>
    </div>

    <div id="history">
      <div class="chat" id="chat">
        <div id="bottom-spacer"></div>
      </div>
    </div>

    <div id="composer">
      <div class="input-wrap">
        <div class="input-inner">
          <textarea id="msg" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"></textarea>
          <button id="sendBtn">发送</button>
          <button id="stopBtn">停止</button>
        </div>
        <div class="composer-hint">Enter 发送 · Shift+Enter 换行</div>
      </div>
    </div>
  </div>

  <div id="settingsMask">
    <div id="settings">
      <div id="settingsHead">
        <div class="t">设置 / Settings</div>
        <button id="closeSettings">✕</button>
      </div>
      <div id="settingsBody">
        <div class="card">
          <h4>本地历史（Local History）</h4>
          <p>
            开启后，聊天记录会保存在浏览器本地（localStorage）。<br>
            关闭后，刷新页面会丢失当前对话。
          </p>
          <div class="rowline">
            <div class="toggle">
              <input type="checkbox" id="historyKeep">
              <label for="historyKeep">保留本地历史（启用本地记忆）</label>
            </div>
            <div class="btns">
              <button class="smallbtn danger" id="clearHistory">清除本地历史</button>
            </div>
          </div>
        </div>

        <div class="card">
          <h4>网页自定义人物模板（Web Custom Persona）</h4>
          <p>
            ⚠️ 仅当右上角为 <b>😇</b> 时，此处才会生效；<b>😈 会忽略这里</b>。<br>
            清除模板只会删除网页自定义内容，不会影响本地历史。
          </p>

          <div class="rowline">
            <div class="toggle">
              <input type="checkbox" id="promptKeep">
              <label for="promptKeep">保留自定义人物模板（保存到本地）</label>
            </div>
            <div class="btns">
              <button class="smallbtn danger" id="clearPrompt">清除自定义模板</button>
            </div>
          </div>

          <textarea id="customPrompt" placeholder="仅😇时生效：在这里写网页端自定义 system prompt（可多行）。"></textarea>

          <div class="rowline">
            <div></div>
            <div class="btns">
              <button class="smallbtn" id="savePrompt">保存</button>
              <button class="smallbtn" id="closeSettings">关闭</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="donateMask">
    <div id="donateCard">
      <div id="donateHead">
        <div class="t">打赏 / Donate</div>
        <button id="donateClose">✕</button>
      </div>
      <div id="donateBody">
        <img id="donateImg" src="/donate.png" alt="WeChat Pay QR" />
        <div id="donateNote">
          如果真的帮助到了你，请为我打赏一杯咖啡吧，有了你的赞助，我会将服务一直运行下去的。
        </div>
      </div>
    </div>
  </div>

  <div class="controls-panel" id="controlsPanel">
    <button id="themeToggle" class="ctrl-btn">🌙 黑夜模式</button>
    <button id="fontDecrease" class="ctrl-btn" title="减小字体">A-</button>
    <button id="fontIncrease" class="ctrl-btn" title="增大字体">A+</button>
  </div>

  <div id="sessionOverlay"></div>
  <div id="sessionPanel">
    <div class="session-header">
      <strong>会话管理</strong>
      <button id="closeSessionPanel" class="ctrl-btn" style="background:none;">✕</button>
    </div>
    <div class="session-list" id="sessionList"></div>
    <button id="newSessionBtn" class="new-session-btn">➕ 新建会话</button>
  </div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
